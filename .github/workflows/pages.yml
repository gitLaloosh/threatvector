# Publishes threatvector.space (build queue 027; Project doc roadmap/page-publish-plan.md). On every merge to main, and by hand,
# tools/publish.py makes the served copy (index.html without comments; every other tracked file as is) and GitHub Pages
# deploys it. Needs Settings -> Pages -> Source: "GitHub Actions" (the owner's one-time switch-over, plan section 3); to go
# back, set the source to "Deploy from a branch" (main, / (root)) and the commented page is served again.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: The copy of acorn in tools/publish matches acorn 8.18.0 from npm
        run: |
          cd "$RUNNER_TEMP"
          npm pack acorn@8.18.0 --silent
          tar xzf acorn-8.18.0.tgz
          want=$(sha256sum package/dist/acorn.js | cut -d' ' -f1)
          got=$(sha256sum "$GITHUB_WORKSPACE/tools/publish/acorn.js" | cut -d' ' -f1)
          echo "npm: $want  repo: $got"
          test "$want" = "$got"
      - name: Make the served copy
        run: python3 -I tools/publish.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
